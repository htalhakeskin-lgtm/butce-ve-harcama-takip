# PR pipeline (ci standard §4). The same checks run locally with `pnpm check`.
name: PR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Migrations match the schema (DT-02)
        run: pnpm exec drizzle-kit generate --name ci-check && git diff --exit-code -- src/server/db/migrations

  integration:
    name: Integration tests (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: End-to-end (S1 demo scenario)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: butce, POSTGRES_PASSWORD: butce, POSTGRES_DB: butce }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U butce" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://butce:butce@localhost:5432/butce
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_APP_NAME: Bütçe
      EMAIL_TRANSPORT: file
      EMAIL_FROM: "Bütçe <no-reply@example.com>"
      AUTH_RATE_LIMIT: "off"
      PASSWORD_BREACH_CHECK: "off"
      NEXT_DIST_DIR: .next-e2e
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
